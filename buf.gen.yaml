version: v2
clean: true
inputs:
  - directory: .
    # Core's vendored import closure stays with Core. Accounts now references
    # host installation messages, so include that referenced schema too.
    paths:
      - saas
      - host/installation/v1/installation.proto
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/codefly-dev/saas-sdk-go/gen
    - file_option: go_package_prefix
      path: codefly
      value: github.com/codefly-dev/core/generated/go
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: gen
    opt: paths=source_relative
  - local: [go, run, connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0]
    out: gen
    opt: paths=source_relative
