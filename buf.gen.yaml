version: v2
clean: true
inputs:
  - directory: .
    # Core's vendored import closure is compiled, but its Go bindings belong
    # to the Core dependency. Generate every host-owned public schema.
    paths:
      - saas
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/codefly-dev/saas-sdk-go/gen
    - file_option: go_package_prefix
      path: codefly
      value: github.com/codefly-dev/core/generated/go
    # Shared installation approvals belong to the canonical Authority schema.
    # Import those bindings rather than registering another host.* descriptor.
    - file_option: go_package_prefix
      path: host
      value: github.com/codefly-dev/authority/libraries/authority-client/go/gen
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: gen
    opt: paths=source_relative
  - local: [go, run, connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0]
    out: gen
    opt: paths=source_relative
